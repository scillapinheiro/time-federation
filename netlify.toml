[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Root: send visitors to their language, English by default
[[redirects]]
  from = "/"
  to = "/pt/"
  status = 302
  conditions = { Language = ["pt"] }

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Test links (branch deploys and pull request previews) also show the
# sections that are switched off in production (Store, Live).
[context.deploy-preview.environment]
  PREVIEW = "1"

[context.branch-deploy.environment]
  PREVIEW = "1"

# Staging (hml) mirrors production: Store and Live stay hidden.
[context.hml.environment]
  PREVIEW = "0"
