[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Root: send visitors to their language, English by default
[[redirects]]
  from = "/"
  to = "/pt/"
  status = 302
  conditions = { Language = ["pt"] }

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Test links (branch deploys and pull request previews) read the staging
# panel and also show the sections switched off in production (Store, Live).
[context.deploy-preview.environment]
  PREVIEW = "1"
  SANITY_DATASET = "staging"

[context.branch-deploy.environment]
  PREVIEW = "1"
  SANITY_DATASET = "staging"

# Staging (hml) reads the staging panel and behaves like production:
# Store and Live follow their switches in that panel.
[context.hml.environment]
  PREVIEW = "0"
  SANITY_DATASET = "staging"
