[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Root: send visitors to their language, English by default
[[redirects]]
  from = "/"
  to = "/pt/"
  status = 302
  conditions = { Language = ["pt"] }

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
